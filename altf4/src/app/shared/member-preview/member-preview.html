<article class="profile-card">
  <img
    class="profile-image"
    [src]="image()"
    [alt]="name()"
  />

  <div class="profile-content">
    <h2>{{ name() }}</h2>

    <p class="profile-role">{{ role() }}</p>

    <a
      class="github-link"
      [href]="github()"
      target="_blank"
      rel="noopener noreferrer"
    >
      GitHub Profile
    </a>

    <button
      mat-stroked-button
      class="description-button"
      type="button"
      (click)="showDescription()"
    >
      About me
    </button>

    <p class="profile-description">{{ displayDescription() }}</p>
    
  </div>
</article>
